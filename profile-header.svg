<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Curious by default</title>
  <desc id="desc">A warm beige editorial banner with subtle grid lines and a circuit-orbit illustration.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#D9CFBE" stroke-width="0.8" opacity="0.45"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2E9"/>
      <stop offset="1" stop-color="#EEE5D7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="22" fill="url(#paper)" stroke="#D8CDBB" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="268" rx="22" fill="url(#grid)"/>
  <rect x="40" y="38" width="6" height="184" rx="3" fill="#7A8061"/>
  <text x="72" y="76" fill="#7A8061" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">FIELD NOTES</text>
  <text x="70" y="137" fill="#484337" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="bold">Curious by default.</text>
  <text x="72" y="178" fill="#665E50" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">With a habit of asking one more question.</text>
  <line x1="72" y1="204" x2="595" y2="204" stroke="#C5B8A3" stroke-width="1.5"/>
  <text x="72" y="230" fill="#817665" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.5">MODELS · MECHANISMS · MEANING</text>
  <!-- restrained systems / orbit motif -->
  <g transform="translate(875 135)">
    <circle r="87" fill="#E7DDCC" opacity="0.78"/>
    <circle r="69" fill="none" stroke="#B9AA91" stroke-width="1.6" stroke-dasharray="4 7"/>
    <ellipse rx="93" ry="36" fill="none" stroke="#8A8D6D" stroke-width="2" transform="rotate(-32)"/>
    <ellipse rx="82" ry="49" fill="none" stroke="#B9785B" stroke-width="1.6" transform="rotate(46)"/>
    <rect x="-29" y="-29" width="58" height="58" rx="10" fill="#F7F2E9" stroke="#756E5B" stroke-width="2"/>
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#D8CBB5" stroke="#756E5B" stroke-width="1.5"/>
    <path d="M -42 -14 H -29 M -42 0 H -29 M -42 14 H -29 M 29 -14 H 42 M 29 0 H 42 M 29 14 H 42 M -14 -42 V -29 M 0 -42 V -29 M 14 -42 V -29 M -14 29 V 42 M 0 29 V 42 M 14 29 V 42" fill="none" stroke="#756E5B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="61" cy="-53" r="7" fill="#B9785B" stroke="#F7F2E9" stroke-width="3"/>
    <circle cx="-72" cy="20" r="6" fill="#7A8061" stroke="#F7F2E9" stroke-width="3"/>
    <circle cx="20" cy="82" r="5" fill="#B9785B" stroke="#F7F2E9" stroke-width="2"/>
  </g>
  <g fill="#B9785B">
    <circle cx="1090" cy="48" r="3"/><circle cx="1110" cy="48" r="3"/><circle cx="1130" cy="48" r="3"/>
  </g>
  <path d="M 1054 210 h 76" stroke="#B9AA91" stroke-width="1.4" stroke-linecap="round"/>
  <text x="1054" y="230" fill="#817665" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.6">KEEP ASKING</text>
</svg>
